name: DeadlineHQ - Daily Status Update

on:
  schedule:
    # Run every day at 3:00 PM UTC (9:00 AM CST)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  daily-status:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: mainline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decrypt data
        env:
          DEADLINEHQ_ENCRYPTION_KEY: ${{ secrets.DEADLINEHQ_ENCRYPTION_KEY }}
        run: |
          if [ -f tasks.enc ]; then
            python -c "from src.encryption import decrypt_file; decrypt_file('tasks.enc', 'tasks.json')"
            echo "Decrypted tasks.enc -> tasks.json"
          else
            echo "[]" > tasks.json
            echo "No tasks.enc found, no tasks to report"
          fi
          if [ -f config.enc ]; then
            python -c "from src.encryption import decrypt_file; decrypt_file('config.enc', 'config.json')"
            echo "Decrypted config.enc -> config.json"
          fi

      - name: Show current tasks
        run: python main.py list

      - name: Send daily status updates
        env:
          DEADLINEHQ_RESEND_API_KEY: ${{ secrets.DEADLINEHQ_RESEND_API_KEY }}
          DEADLINEHQ_EMAIL_PASSWORD: ${{ secrets.DEADLINEHQ_EMAIL_PASSWORD }}
          DEADLINEHQ_SENDER_EMAIL: ${{ secrets.DEADLINEHQ_SENDER_EMAIL }}
        run: |
          python -c "
          from src.storage import load_tasks
          from src.reminder import send_daily_status

          tasks = load_tasks()
          print(f'Total tasks: {len(tasks)}')
          
          emails_sent = 0
          for task in tasks:
              print(f'Task: {task.name} (subscribers: {len(task.subscribers)})')
              for sub in task.subscribers:
                  print(f'  Sending status to: {sub}')
                  send_daily_status(task, sub)
                  emails_sent += 1
          
          print(f'---')
          print(f'Total status emails sent: {emails_sent}')
          if emails_sent == 0:
              print('No subscribers found. Add subscribers with: add_subscriber action')
          "
